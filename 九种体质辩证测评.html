<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>九种体质辩证测评</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5efe8;
            color: #3d2c1e;
            min-height: 100vh;
            padding: 0 0 40px;
        }
        .app {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 16px 30px;
        }
        .card {
            background: #fffcf8;
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 4px 20px rgba(120, 80, 50, 0.08);
            border: 1px solid rgba(200, 170, 140, 0.20);
        }
        .hidden {
            display: none !important;
        }

        /* ===== 品牌 ===== */
        .brand {
            text-align: center;
            padding: 14px 0 10px;
        }
        .brand h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #8b5a3c, #5d3a24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .brand .sub {
            font-size: 13px;
            color: #a0806a;
            letter-spacing: 2px;
            margin-top: 2px;
            font-weight: 300;
        }
        .brand .badge {
            display: inline-block;
            background: #e8d5c4;
            color: #6a4a34;
            font-size: 11px;
            padding: 4px 14px;
            border-radius: 30px;
            margin-top: 4px;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* ===== 版本选择 ===== */
        .version-select .v-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }
        .version-select .v-btn {
            padding: 16px 12px;
            border-radius: 16px;
            border: 2px solid #e0d0c0;
            background: #fffcf8;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s;
            font-size: 14px;
            font-weight: 600;
            color: #5d3a24;
            line-height: 1.5;
        }
        .version-select .v-btn .tag {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: #a0806a;
            margin-top: 2px;
        }
        .version-select .v-btn .count {
            display: block;
            font-size: 12px;
            font-weight: 400;
            color: #b09078;
            margin-top: 1px;
        }
        .version-select .v-btn.active {
            border-color: #8b5a3c;
            background: #f8f0e8;
            box-shadow: 0 0 0 3px rgba(139, 90, 60, 0.15);
        }
        .version-select .v-btn:active {
            transform: scale(0.97);
        }

        /* ===== 个人资料表单 ===== */
        .profile-form {
            margin-top: 18px;
        }
        .profile-form .form-title {
            font-size: 15px;
            font-weight: 600;
            color: #5d3a24;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .profile-form .form-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0d0c0;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #6a4a34;
            margin-bottom: 4px;
        }
        .form-group label .required {
            color: #c05050;
            margin-left: 2px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e8ddd0;
            border-radius: 12px;
            font-size: 15px;
            color: #3d2c1e;
            background: #fcf8f4;
            transition: border-color 0.2s;
            font-family: inherit;
            outline: none;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #8b5a3c;
            box-shadow: 0 0 0 3px rgba(139, 90, 60, 0.08);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 56px;
            line-height: 1.6;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .form-row .form-group {
            margin-bottom: 0;
        }

        /* ===== 开始按钮 ===== */
        .btn-start {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #8b5a3c, #6a402a);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 4px 18px rgba(139, 90, 60, 0.30);
            transition: all 0.25s;
            margin-top: 14px;
        }
        .btn-start:active {
            transform: scale(0.97);
            box-shadow: 0 2px 10px rgba(139, 90, 60, 0.20);
        }
        .btn-start:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== 答题页 ===== */
        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        .progress-bar {
            flex: 1;
            height: 6px;
            background: #ece0d6;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #b88a6a, #8b5a3c);
            border-radius: 10px;
            transition: width 0.4s ease;
        }
        .progress-text {
            font-size: 14px;
            font-weight: 600;
            color: #7a4a2e;
            min-width: 52px;
            text-align: right;
        }

        .q-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .q-type {
            display: inline-block;
            background: #e8d5c4;
            color: #5d3a24;
            font-size: 12px;
            font-weight: 600;
            padding: 3px 14px;
            border-radius: 30px;
            letter-spacing: 1px;
        }
        .q-reverse {
            display: inline-block;
            background: #f0d8cc;
            color: #a05030;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 30px;
            font-weight: 500;
        }
        .q-number {
            font-size: 14px;
            color: #a0806a;
            font-weight: 500;
            margin-left: auto;
        }
        .q-text {
            font-size: 18px;
            font-weight: 500;
            line-height: 1.7;
            color: #3d2c1e;
            padding: 6px 0 14px;
            min-height: 56px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .options .opt {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border-radius: 14px;
            background: #faf5f0;
            border: 1.5px solid #ede4db;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
            color: #4d3a2a;
            font-weight: 400;
            user-select: none;
        }
        .options .opt:active {
            transform: scale(0.98);
        }
        .options .opt .dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #d5c0b0;
            margin-right: 14px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
            font-size: 12px;
            color: #8b5a3c;
            font-weight: 700;
        }
        .options .opt.selected {
            border-color: #8b5a3c;
            background: #f5ede6;
            box-shadow: 0 0 0 2px rgba(139, 90, 60, 0.10);
        }
        .options .opt.selected .dot {
            border-color: #8b5a3c;
            background: #8b5a3c;
            color: #fff;
        }
        .options .opt .label {
            flex: 1;
        }
        .options .opt .score-label {
            font-size: 12px;
            color: #a0806a;
            margin-left: 8px;
            font-weight: 300;
        }
        /* 自动跳转提示 */
        .auto-hint {
            text-align: center;
            font-size: 13px;
            color: #b09078;
            margin-top: 12px;
            letter-spacing: 1px;
            opacity: 0.7;
        }

        /* ===== 导航 ===== */
        .nav-btns {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }
        .nav-btns button {
            flex: 1;
            padding: 14px 10px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 1px;
        }
        .nav-btns .btn-prev {
            background: #ede4db;
            color: #6a4a34;
        }
        .nav-btns .btn-prev:active {
            background: #ddd0c4;
            transform: scale(0.97);
        }
        .nav-btns .btn-prev:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== 结果页 ===== */
        .result-wrap {
            animation: fadeUp 0.5s ease;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-profile {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            background: #f8f0e8;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #5d3a24;
        }
        .result-profile .rp-item {
            text-align: center;
        }
        .result-profile .rp-item .rp-label {
            font-size: 11px;
            color: #a0806a;
        }
        .result-profile .rp-item .rp-value {
            font-weight: 600;
            margin-top: 2px;
        }

        .result-final {
            text-align: center;
            padding: 20px 16px;
            border-radius: 18px;
            margin-bottom: 18px;
            background: linear-gradient(135deg, #f8f0e8, #f0e6dc);
            border: 2px solid #d5c0b0;
        }
        .result-final .final-label {
            font-size: 13px;
            color: #8a6a54;
            letter-spacing: 2px;
        }
        .result-final .final-type {
            font-size: 28px;
            font-weight: 800;
            color: #5d3a24;
            margin: 6px 0 4px;
        }
        .result-final .final-status {
            font-size: 15px;
            color: #8a6a54;
            font-weight: 500;
        }
        .result-final .final-badge {
            display: inline-block;
            padding: 4px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 6px;
        }
        .final-badge.pinghe {
            background: #c9b8a8;
            color: #3d2c1e;
        }
        .final-badge.yes {
            background: #d4c4b0;
            color: #5d3a24;
        }
        .final-badge.tend {
            background: #f0e0d0;
            color: #8a5a3a;
        }
        .final-badge.no {
            background: #ece4dc;
            color: #8a7a6a;
        }

        /* 体质详情 */
        .result-detail-section {
            margin-top: 18px;
        }
        .result-detail-section .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #5d3a24;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-detail-section .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0d0c0;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .detail-grid .dg-item {
            background: #faf5f0;
            border-radius: 12px;
            padding: 12px 14px;
            border-left: 4px solid #d5c0b0;
        }
        .detail-grid .dg-item .dg-label {
            font-size: 12px;
            color: #a0806a;
            font-weight: 500;
        }
        .detail-grid .dg-item .dg-value {
            font-size: 14px;
            color: #3d2c1e;
            margin-top: 4px;
            line-height: 1.6;
        }
        .detail-grid .dg-item.full {
            grid-column: 1 / -1;
        }

        /* 所有体质得分条 */
        .result-bars {
            margin-top: 16px;
        }
        .result-bars .rb-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 10px;
            background: #faf5f0;
            margin-bottom: 5px;
            gap: 10px;
        }
        .result-bars .rb-item .rb-name {
            width: 60px;
            font-size: 13px;
            font-weight: 600;
            color: #5d3a24;
            flex-shrink: 0;
        }
        .result-bars .rb-item .rb-bar {
            flex: 1;
            height: 7px;
            background: #ece0d6;
            border-radius: 10px;
            overflow: hidden;
        }
        .result-bars .rb-item .rb-bar .rb-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.8s ease;
        }
        .result-bars .rb-item .rb-score {
            font-size: 13px;
            font-weight: 700;
            color: #5d3a24;
            min-width: 38px;
            text-align: right;
        }
        .result-bars .rb-item .rb-tag {
            font-size: 11px;
            font-weight: 600;
            min-width: 42px;
            text-align: right;
            color: #8a6a54;
        }

        /* 结果按钮 */
        .result-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .result-actions button {
            flex: 1;
            padding: 14px 10px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 1px;
        }
        .result-actions .btn-retest {
            background: #ede4db;
            color: #6a4a34;
        }
        .result-actions .btn-retest:active {
            background: #ddd0c4;
            transform: scale(0.97);
        }
        .result-actions .btn-switch {
            background: #f5ede6;
            color: #6a4a34;
            border: 1.5px solid #d5c0b0;
        }
        .result-actions .btn-switch:active {
            transform: scale(0.97);
        }

        /* ===== 免责 ===== */
        .disclaimer {
            margin-top: 24px;
            padding: 14px 18px;
            background: #f8f0e8;
            border-radius: 14px;
            font-size: 12px;
            color: #8a7a6a;
            line-height: 1.8;
            border-left: 4px solid #d5c0b0;
        }
        .disclaimer strong {
            color: #6a4a34;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 420px) {
            .app {
                padding: 10px 10px 20px;
            }
            .card {
                padding: 18px 14px;
            }
            .q-text {
                font-size: 16px;
            }
            .options .opt {
                padding: 12px 14px;
                font-size: 14px;
            }
            .result-profile {
                grid-template-columns: 1fr 1fr 1fr;
                font-size: 12px;
                padding: 10px 12px;
            }
            .detail-grid {
                grid-template-columns: 1fr;
            }
            .detail-grid .dg-item.full {
                grid-column: 1;
            }
            .result-final .final-type {
                font-size: 24px;
            }
            .form-row {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .brand h1 {
                font-size: 19px;
            }
            .version-select .v-btn {
                padding: 12px 10px;
                font-size: 13px;
            }
        }
        @media (max-width: 360px) {
            .result-profile {
                grid-template-columns: 1fr 1fr;
            }
            .result-bars .rb-item .rb-name {
                width: 48px;
                font-size: 12px;
            }
        }

        .fade-in {
            animation: fadeIn 0.35s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #f0e8e0;
        }
        ::-webkit-scrollbar-thumb {
            background: #d5c0b0;
            border-radius: 10px;
        }

        /* 选项禁用点击（跳转动画期间） */
        .options .opt.disabled {
            pointer-events: none;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- 品牌 -->
        <div class="brand">
            <h1>九体质 · 辨体测评</h1>
            <div class="sub">中医体质分类与判定标准</div>
            <div class="badge">亚健康 · 养生调养参考</div>
        </div>

        <!-- ======== 版本选择 + 个人资料 ======== -->
        <div class="card" id="homePage">
            <div class="version-select">
                <div style="font-size:15px;font-weight:600;color:#5d3a24;text-align:center;">选择测评版本</div>
                <div class="v-grid">
                    <div class="v-btn active" data-v="2009" id="v2009">
                        2009 原版
                        <span class="tag">行业通用 · 研修班</span>
                        <span class="count">67 题 · 详细辨证</span>
                    </div>
                    <div class="v-btn" data-v="2025" id="v2025">
                        2025 新版
                        <span class="tag">国标 GB/T 46939</span>
                        <span class="count">30 题 · 快速自测</span>
                    </div>
                </div>
            </div>

            <!-- 个人资料 -->
            <div class="profile-form">
                <div class="form-title">📋 个人资料</div>
                <div class="form-group">
                    <label>真实姓名 <span class="required">*</span></label>
                    <input type="text" id="userName" placeholder="请输入您的姓名" maxlength="20">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>性别 <span class="required">*</span></label>
                        <select id="userGender">
                            <option value="">请选择</option>
                            <option value="男">男</option>
                            <option value="女">女</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>出生日期 <span class="required">*</span></label>
                        <input type="date" id="userBirth">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>身高 (cm) <span class="required">*</span></label>
                        <input type="number" id="userHeight" placeholder="170" min="50" max="250">
                    </div>
                    <div class="form-group">
                        <label>体重 (kg) <span class="required">*</span></label>
                        <input type="number" id="userWeight" placeholder="65" min="20" max="300">
                    </div>
                </div>
                <div class="form-group">
                    <label>腰围 (cm) <span class="required">*</span></label>
                    <input type="number" id="userWaist" placeholder="80" min="40" max="200">
                </div>
                <div class="form-group">
                    <label>疾病史（如高血压、糖尿病等，无则填"无"）<span class="required">*</span></label>
                    <textarea id="userHistory" placeholder="请填写您已知的疾病史，若无请填「无」" rows="2"></textarea>
                </div>
                <button class="btn-start" id="startBtn">开始测评 →</button>
            </div>

            <div class="disclaimer" style="margin-top:16px;">
                <strong>⚠️ 商用合规提示</strong><br>
                本量表仅作亚健康养生参考工具，<strong>严禁使用“诊断、治病、诊疗、确诊”等医疗词汇</strong>。
                不可替代执业中医师专业诊疗。搭配温养项目时，只做养生搭配建议，不承诺改善病症。
            </div>
        </div>

        <!-- ======== 答题页 ======== -->
        <div class="card hidden" id="quizPage">
            <div class="progress-wrap">
                <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
                <span class="progress-text" id="progressText">0/0</span>
            </div>
            <div class="question-area" id="questionArea"></div>
            <div class="nav-btns">
                <button class="btn-prev" id="prevBtn">← 上一题</button>
                <button class="btn-prev" style="flex:0.6;background:transparent;color:#b09078;font-weight:400;cursor:default;border:none;pointer-events:none;" disabled>自动跳转</button>
            </div>
            <div class="auto-hint">✓ 选择后自动进入下一题</div>
        </div>

        <!-- ======== 结果页 ======== -->
        <div class="card hidden" id="resultPage">
            <div class="result-wrap" id="resultWrap"></div>
        </div>
    </div>

    <script>
        // ================================================================
        //  1. 数据定义
        // ================================================================

        // -------- 体质详细说明 --------
        const CONST_DETAILS = {
            '平和质': {
                summary: '阴阳气血调和，以体态适中、面色红润、精力充沛等为主要特征。',
                body: '体形匀称健壮。',

            if (!waist || isNaN(waist) || Number(waist) < 30) { valid = false;
                $('userWaist').focus();
                alert('请填写有效腰围（cm）'); return; }
            if (!history) { valid = false;
                $('userHistory').focus();
                alert('请填写疾病史（无则填"无"）'); return; }

            state.profile = {
                name,
                gender,
                birth,
                height: Number(height),
                weight: Number(weight),
                waist: Number(waist),
                history
            };

            // 初始化数据
            const v = state.version;
            state.data = v === '2009' ? DATA_2009 : DATA_2025;
            state.totalQuestions = state.data.questions.length;
            state.answers = new Array(state.totalQuestions).fill(0);
            state.currentIndex = 0;
            state.isTransitioning = false;

            homePage.classList.add('hidden');
            quizPage.classList.remove('hidden');
            resultPage.classList.add('hidden');

            renderQuestion();
            updateProgress();
            updateNavButtons();
        }

        // ================================================================
        //  5. 渲染题目
        // ================================================================
        function renderQuestion() {
            const idx = state.currentIndex;
            const qs = state.data.questions;
            const q = qs[idx];
            const total = qs.length;
            const selected = state.answers[idx];

            const typeLabel = q.type;
            const isReverse = q.reverse;
            const color = CONST_COLORS[q.type] || '#8b5a3c';

            let html = `
                <div class="fade-in">
                    <div class="q-header">
                        <span class="q-type" style="background:${color}20;color:${color};">${typeLabel}</span>
                        ${isReverse ? '<span class="q-reverse">反向计分 *</span>' : ''}
                        <span class="q-number">${idx+1} / ${total}</span>
                    </div>
                    <div class="q-text">${q.text}</div>
                    <div class="options" id="optionsContainer">
            `;

            const labels = ['没有', '很少', '有时', '经常', '总是'];
            for (let i = 1; i <= 5; i++) {
                const sel = (selected === i) ? 'selected' : '';
                html += `
                    <div class="opt ${sel}" data-score="${i}" onclick="selectOption(${idx}, ${i})">
                        <span class="dot">${i}</span>
                        <span class="label">${labels[i-1]}</span>
                        <span class="score-label">${i}分</span>
                    </div>
                `;
            }

            html += `</div></div>`;
            questionArea.innerHTML = html;
            updateProgress();
            updateNavButtons();
        }

        // ================================================================
        //  6. 选择选项 + 自动跳转
        // ================================================================
        window.selectOption = function(idx, score) {
            if (state.isTransitioning) return;
            // 如果已选相同分数，不重复触发
            if (state.answers[idx] === score) return;

            state.answers[idx] = score;
            renderQuestion();

            // 高亮选中的选项
            const opts = document.querySelectorAll('.opt');
            opts.forEach(el => {
                const s = parseInt(el.dataset.score);
                if (s === score) el.classList.add('selected');
                else el.classList.remove('selected');
            });

            // 标记正在过渡
            state.isTransitioning = true;
            // 禁用所有选项（防止连点）
            document.querySelectorAll('.opt').forEach(el => el.classList.add('disabled'));

            // 延迟自动跳转
            const delay = 350;
            setTimeout(() => {
                state.isTransitioning = false;
                document.querySelectorAll('.opt').forEach(el => el.classList.remove('disabled'));

                const isLast = (idx === state.totalQuestions - 1);
                if (isLast) {
                    // 最后一题，自动显示结果
                    showResult();
                } else {
                    // 进入下一题
                    state.currentIndex = idx + 1;
                    renderQuestion();
                    updateProgress();
                    updateNavButtons();
                    // 滚动到题目顶部
                    const qArea = document.querySelector('.question-area');
                    if (qArea) qArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }, delay);
        };

        // ================================================================
        //  7. 导航
        // ================================================================
        function goPrev() {
            if (state.currentIndex > 0 && !state.isTransitioning) {
                state.currentIndex--;
                renderQuestion();
                updateProgress();
                updateNavButtons();
            }
        }

        function updateProgress() {
            const total = state.totalQuestions;
            const answered = state.answers.filter(a => a > 0).length;
            const pct = total > 0 ? (answered / total * 100) : 0;
            progressFill.style.width = Math.min(pct, 100) + '%';
            progressText.textContent = `${answered}/${total}`;
        }

        function updateNavButtons() {
            prevBtn.disabled = (state.currentIndex === 0);
            prevBtn.style.opacity = (state.currentIndex === 0) ? '0.3' : '1';
        }

        // ================================================================
        //  8. 计算结果
        // ================================================================
        function computeResults() {
            const data = state.data;
            const qs = data.questions;
            const answers = state.answers;
            const constMap = data.constitutions;

            const groups = {};
            for (const [name, info] of Object.entries(constMap)) {
                groups[name] = {
                    total: info.total,
                    reverse: info.reverse || [],
                    scores: []
                };
            }

            qs.forEach((q, idx) => {
                const raw = answers[idx] || 0;
                let score = raw;
                if (q.reverse && raw > 0) {
                    score = 6 - raw;
                }
                if (groups[q.type]) {
                    groups[q.type].scores.push(score);
                }
            });

            const results = {};
            for (const [name, info] of Object.entries(groups)) {
                const scores = info.scores.slice(0, info.total);
                const sum = scores.reduce((a, b) => a + b, 0);
                const total = info.total;
                const rawScore = sum;
                const transformScore = total > 0 ? ((rawScore - total) / (total * 4)) * 100 : 0;
                results[name] = {
                    raw: rawScore,
                    transform: Math.round(transformScore * 10) / 10,
                    total: total,
                    scores: scores
                };
            }
            return results;
        }

        function getJudgment(name, score, allResults) {
            if (name === '平和质') {
                const pingheScore = score;
                let allLow = true;
                for (const [n, r] of Object.entries(allResults)) {
                    if (n !== '平和质' && r.transform >= 30) { allLow = false; break; }
                }
                if (pingheScore >= 60 && allLow) return { status: '标准平和', short: '平和', cls: 'pinghe' };
                if (pingheScore >= 60) return { status: '倾向偏颇', short: '倾向偏颇', cls: 'tend' };
                if (pingheScore >= 30) return { status: '非平和质', short: '非平和', cls: 'no' };
                return { status: '非平和质', short: '非平和', cls: 'no' };
            }
            if (score >= 40) return { status: '是', short: '是', cls: 'yes' };
            if (score >= 30) return { status: '倾向是', short: '倾向', cls: 'tend' };
            return { status: '否', short: '否', cls: 'no' };
        }

        // ================================================================
        //  9. 判定最终体质
        // ================================================================
        function determineFinalType(results) {
            const pinghe = results['平和质'];
            const isPinghe = pinghe && pinghe.transform >= 60;
            let allLow = true;
            for (const [n, r] of Object.entries(results)) {
                if (n !== '平和质' && r.transform >= 30) { allLow = false; break; }
            }
            if (isPinghe && allLow) {
                return { type: '平和质', status: '标准平和', cls: 'pinghe' };
            }

            // 找出偏颇体质中转化分最高的
            let maxScore = -1;
            let maxType = '平和质';
            let maxStatus = '否';
            for (const [name, r] of Object.entries(results)) {
                if (name === '平和质') continue;
                const j = getJudgment(name, r.transform, results);
                // 优先取 "是" > "倾向是" > "否"，同等级取分数高
                let rank = 0;
                if (j.cls === 'yes') rank = 3;
                else if (j.cls === 'tend') rank = 2;
                else if (j.cls === 'no') rank = 1;

                let curRank = 0;
                if (maxStatus === '是') curRank = 3;
                else if (maxStatus === '倾向') curRank = 2;
                else if (maxStatus === '否') curRank = 1;

                if (rank > curRank || (rank === curRank && r.transform > maxScore)) {
                    maxScore = r.transform;
                    maxType = name;
                    maxStatus = j.short;
                }
            }

            // 如果最高分 < 30，判定为"无明显偏颇"
            if (maxScore < 30) {
                return { type: '平和倾向', status: '无明显偏颇', cls: 'no' };
            }

            const j = getJudgment(maxType, maxScore, results);
            return { type: maxType, status: j.short, cls: j.cls };
        }

        // ================================================================
        //  10. 展示结果
        // ================================================================
        function showResult() {
            const results = computeResults();
            const final = determineFinalType(results);
            const p = state.profile;

            // 计算年龄
            let age = '--';
            if (p.birth) {
                const birthDate = new Date(p.birth);
                const today = new Date();
                age = today.getFullYear() - birthDate.getFullYear();
                const m = today.getMonth() - birthDate.getMonth();
                if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
                if (age < 0) age = '--';
            }

            const detail = CONST_DETAILS[final.type] || CONST_DETAILS['平和质'];

            let html = `
                <div class="fade-in">
                    <div class="result-profile">
                        <div class="rp-item"><div class="rp-label">姓名</div><div class="rp-value">${p.name || '--'}</div></div>
                        <div class="rp-item"><div class="rp-label">性别</div><div class="rp-value">${p.gender || '--'}</div></div>
                        <div class="rp-item"><div class="rp-label">年龄</div><div class="rp-value">${age} 岁</div></div>
                        <div class="rp-item"><div class="rp-label">身高</div><div class="rp-value">${p.height || '--'} cm</div></div>
                        <div class="rp-item"><div class="rp-label">体重</div><div class="rp-value">${p.weight || '--'} kg</div></div>
                        <div class="rp-item"><div class="rp-label">腰围</div><div class="rp-value">${p.waist || '--'} cm</div></div>
                        <div class="rp-item full" style="grid-column:1/-1;text-align:center;border-top:1px solid #e0d0c0;padding-top:8px;margin-top:4px;">
                            <div class="rp-label">疾病史</div>
                            <div class="rp-value" style="font-weight:400;">${p.history || '--'}</div>
                        </div>
                    </div>

                    <div class="result-final" style="border-color:${CONST_COLORS[final.type] || '#d5c0b0'};">
                        <div class="final-label">🏷️ 最终体质判定</div>
                        <div class="final-type">${final.type}</div>
                        <div class="final-status">${final.status}</div>
                        <span class="final-badge ${final.cls}">${final.status}</span>
                    </div>

                    <div class="result-detail-section">
                        <div class="section-title">📖 体质详解</div>
                        <div class="detail-grid">
                            <div class="dg-item full"><div class="dg-label">总体特征</div><div class="dg-value">${detail.summary || '--'}</div></div>
                            <div class="dg-item"><div class="dg-label">形体特征</div><div class="dg-value">${detail.body || '--'}</div></div>
                            <div class="dg-item"><div class="dg-label">心理特征</div><div class="dg-value">${detail.mind || '--'}</div></div>
                            <div class="dg-item full"><div class="dg-label">常见表现</div><div class="dg-value">${detail.signs || '--'}</div></div>
                            <div class="dg-item"><div class="dg-label">发病倾向</div><div class="dg-value">${detail.disease || '--'}</div></div>
                            <div class="dg-item"><div class="dg-label">适应能力</div><div class="dg-value">${detail.adapt || '--'}</div></div>
                        </div>
                    </div>

                    <div class="result-bars">
                        <div style="font-size:14px;font-weight:600;color:#5d3a24;margin-bottom:10px;">📊 各体质转化分</div>
            `;

            for (const name of CONST_ORDER) {
                const r = results[name];
                if (!r) continue;
                const pct = Math.min(r.transform, 100);
                const color = CONST_COLORS[name] || '#8b5a3c';
                const j = getJudgment(name, r.transform, results);
                html += `
                    <div class="rb-item">
                        <span class="rb-name">${name}</span>
                        <div class="rb-bar"><div class="rb-fill" style="width:${pct}%;background:${color};"></div></div>
                        <span class="rb-score">${r.transform}</span>
                        <span class="rb-tag">${j.short}</span>
                    </div>
                `;
            }

            html += `
                    </div>

                    <div class="result-actions">
                        <button class="btn-retest" onclick="restart()">🔄 重新测评</button>
                        <button class="btn-switch" onclick="switchVersion()">📋 切换版本</button>
                    </div>
                </div>
            `;

            resultWrap.innerHTML = html;
            quizPage.classList.add('hidden');
            resultPage.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ================================================================
        //  11. 全局操作
        // ================================================================
        window.restart = function() {
            resultPage.classList.add('hidden');
            quizPage.classList.remove('hidden');
            state.answers = new Array(state.totalQuestions).fill(0);
            state.currentIndex = 0;
            state.isTransitioning = false;
            renderQuestion();
            updateProgress();
            updateNavButtons();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.switchVersion = function() {
            resultPage.classList.add('hidden');
            homePage.classList.remove('hidden');
            quizPage.classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // ================================================================
        //  12. 键盘支持
        // ================================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && !quizPage.classList.contains('hidden')) {
                goPrev();
            }
            if (e.key >= '1' && e.key <= '5' && !quizPage.classList.contains('hidden')) {
                const idx = state.currentIndex;
                const score = parseInt(e.key);
                if (state.answers[idx] !== score && !state.isTransitioning) {
                    selectOption(idx, score);
                }
            }
            if (e.key === 'Enter' && !homePage.classList.contains('hidden')) {
                startBtn.click();
            }
        });

        // ================================================================
        //  13. 启动
        // ================================================================
        init();
        console.log('🌿 九体质测评已加载 (自动跳转版)');
        console.log('📌 支持 2009原版67题 / 2025新版30题');
        console.log('⚠️ 本工具仅作亚健康养生参考，不可替代医疗诊断');
    </script>

</body>
</html>
