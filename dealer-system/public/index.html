<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7490">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="业绩查询">
<title>经销商业绩查询</title>
<style>
:root{
  --primary:#0e7490; --primary-dark:#155e75; --primary-light:#ecfeff;
  --green:#16a34a; --orange:#ea580c; --red:#dc2626;
  --text:#0f172a; --text2:#475569; --text3:#94a3b8;
  --bg:#f1f5f9; --card:#fff; --line:#e2e8f0;
  --radius:14px; --shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;
  padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:15px}
input,select{font-family:inherit;font-size:16px}
.hide{display:none!important}

/* ---------- 登录/注册 ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(160deg,#0e7490 0%,#155e75 45%,#0f172a 100%)}
.auth-card{width:100%;max-width:420px;background:var(--card);border-radius:20px;padding:32px 26px;
  box-shadow:0 20px 60px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
.brand-sub{color:var(--text3);font-size:13px;margin-bottom:24px}
.tabs{display:flex;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:22px}
.tabs button{flex:1;padding:9px;border-radius:8px;color:var(--text2);font-weight:600;font-size:14px;transition:.15s}
.tabs button.on{background:var(--card);color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;
  background:#fff;transition:.15s;min-height:46px}
.field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,116,144,.1)}
.hint{font-size:12px;color:var(--text3);margin-top:5px;line-height:1.5}
.btn{width:100%;padding:13px;background:var(--primary);color:#fff;border-radius:10px;
  font-weight:600;font-size:16px;min-height:48px;transition:.15s}
.btn:hover{background:var(--primary-dark)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-sec{background:var(--card);color:var(--text2);border:1.5px solid var(--line)}
.btn-sec:hover{background:var(--bg)}
.msg{padding:11px 13px;border-radius:9px;font-size:13.5px;margin-bottom:16px;display:flex;gap:8px;align-items:flex-start}
.msg svg{width:16px;height:16px;flex:none;margin-top:2px}
.msg.err{background:#fef2f2;color:#991b1b}
.msg.ok{background:#f0fdf4;color:#166534}
.msg.info{background:var(--primary-light);color:var(--primary-dark)}

/* ---------- 主界面 ---------- */
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.top .brand h1{font-size:16px}
.top .brand svg{width:26px;height:26px}
.spacer{flex:1}
.who{font-size:13px;color:var(--text2);text-align:right;line-height:1.35}
.who b{display:block;color:var(--text);font-size:14px}
.icon-btn{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  color:var(--text2);border:1px solid var(--line)}
.icon-btn:hover{background:var(--bg);color:var(--primary)}
.icon-btn svg{width:18px;height:18px}
main{max-width:1180px;margin:0 auto;padding:16px 16px 40px}

.notice{background:linear-gradient(135deg,#ecfeff,#f0fdfa);border:1px solid #a5f3fc;
  border-radius:var(--radius);padding:13px 15px;margin-bottom:16px;display:flex;gap:10px;font-size:13.5px;color:#155e75}
.notice svg{width:18px;height:18px;flex:none;margin-top:1px}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card .lab{font-size:12.5px;color:var(--text2);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.card .lab svg{width:14px;height:14px}
.card .val{font-size:25px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.card .sub{font-size:12px;color:var(--text3);margin-top:3px}
.c-green .val{color:var(--green)} .c-orange .val{color:var(--orange)} .c-primary .val{color:var(--primary)}

.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:16px;overflow:hidden}
.panel-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px}
.panel-h h2 svg{width:16px;height:16px;color:var(--primary)}
.panel-b{padding:16px}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl select,.ctrl input{padding:8px 11px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;min-height:40px;background:#fff}
.ctrl select:focus,.ctrl input:focus{outline:none;border-color:var(--primary)}
.mini{padding:8px 13px;border-radius:9px;border:1.5px solid var(--line);color:var(--text2);
  font-size:13.5px;font-weight:600;min-height:40px;display:inline-flex;align-items:center;gap:6px;background:#fff}
.mini:hover{border-color:var(--primary);color:var(--primary)}
.mini svg{width:15px;height:15px}
.mini.pri{background:var(--primary);color:#fff;border-color:var(--primary)}
.mini.pri:hover{background:var(--primary-dark)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:10px 12px;background:#f8fafc;color:var(--text2);font-size:12.5px;
  font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #f1f5f9;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafcfd}
.num{text-align:right;font-weight:600}
.money{color:var(--green)} .comm{color:var(--orange)}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;background:var(--primary-light);color:var(--primary-dark);font-weight:600}
.sortable{cursor:pointer;user-select:none}
.sortable:hover{color:var(--primary)}

.pager{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;flex-wrap:wrap}
.pager button{padding:7px 13px;border:1.5px solid var(--line);border-radius:8px;font-size:13.5px;color:var(--text2);min-height:38px;background:#fff}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager button:not(:disabled):hover{border-color:var(--primary);color:var(--primary)}
.pager .info{font-size:13px;color:var(--text3)}

.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:110px 1fr 92px;align-items:center;gap:10px;font-size:13px}
.bar-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.bar-track{height:20px;background:#f1f5f9;border-radius:5px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#0e7490,#22d3ee);border-radius:5px;transition:width .5s}
.bar-val{text-align:right;font-weight:600;color:var(--green);font-variant-numeric:tabular-nums}

.empty{text-align:center;padding:44px 20px;color:var(--text3)}
.empty svg{width:44px;height:44px;margin-bottom:10px;opacity:.4}

.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:100}
.modal-in{background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
.modal-in h3{font-size:17px;margin-bottom:16px}

.cards-m{display:none}
@media(max-width:900px){ .cards{grid-template-columns:repeat(2,1fr)} }
@media(max-width:640px){
  main{padding:12px 12px 32px}
  .card .val{font-size:21px}
  .who{display:none}
  .table-wrap{display:none}
  .cards-m{display:flex;flex-direction:column;gap:10px;padding:12px}
  .m-item{border:1px solid var(--line);border-radius:11px;padding:12px}
  .m-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
  .m-name{font-weight:600;font-size:14.5px}
  .m-id{font-size:12px;color:var(--text3);margin-top:1px}
  .m-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;
    border-top:1px dashed var(--line);padding-top:8px}
  .m-grid div span{color:var(--text3);font-size:11.5px;display:block}
  .m-grid b{font-variant-numeric:tabular-nums}
  .bar-row{grid-template-columns:78px 1fr 76px;font-size:12px}
  .ctrl{width:100%} .ctrl select,.ctrl input{flex:1;min-width:0}
  .panel-h{padding:12px 13px} .panel-b{padding:13px}
}
</style>
</head>
<body>

<!-- ============ 登录 / 注册 ============ -->
<div id="auth" class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0e7490" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/><circle cx="19" cy="6" r="1.6" fill="#0e7490"/>
      </svg>
      <h1>经销商业绩查询</h1>
    </div>
    <p class="brand-sub">仅限业绩名单内的手机号注册使用</p>

    <div class="tabs">
      <button type="button" id="tabLogin" class="on" onclick="switchTab('login')">登录</button>
      <button type="button" id="tabReg" onclick="switchTab('reg')">首次注册</button>
    </div>

    <div id="authMsg"></div>

    <!-- 登录 -->
    <form id="formLogin" onsubmit="doLogin(event)">
      <div class="field">
        <label>手机号</label>
        <input type="tel" id="loginPhone" inputmode="numeric" maxlength="11" placeholder="请输入注册手机号" autocomplete="username">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="loginPwd" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button class="btn" type="submit" id="btnLogin">登 录</button>
    </form>

    <!-- 注册 -->
    <form id="formReg" class="hide" onsubmit="doRegister(event)">
      <div class="field">
        <label>手机号</label>
        <input type="tel" id="regPhone" inputmode="numeric" maxlength="11" placeholder="请输入业绩表中的手机号" onblur="checkPhone()">
        <div class="hint" id="phoneHint">手机号需已存在于业绩名单中，否则无法注册</div>
      </div>
      <div class="field">
        <label>设置密码</label>
        <input type="password" id="regPwd" placeholder="6-32 位，建议字母+数字" autocomplete="new-password">
      </div>
      <div class="field">
        <label>确认密码</label>
        <input type="password" id="regPwd2" placeholder="再次输入密码" autocomplete="new-password">
      </div>
      <button class="btn" type="submit" id="btnReg">注册并登录</button>
    </form>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="app" class="hide">
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0e7490" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/><circle cx="19" cy="6" r="1.6" fill="#0e7490"/>
        </svg>
        <h1>我的业绩</h1>
      </div>
      <div class="spacer"></div>
      <div class="who"><b id="myName">—</b><span id="myPhone"></span></div>
      <button class="icon-btn" title="修改密码" onclick="openPwd()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      </button>
      <button class="icon-btn" title="退出登录" onclick="doLogout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="notice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <div>此处仅展示与您手机号绑定的<b>名下门店代理业绩</b>。系统已开启行级数据隔离，您无法查看其他经销商的任何数据。</div>
    </div>

    <div class="cards">
      <div class="card c-green">
        <div class="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>业绩金额</div>
        <div class="val" id="sAmount">¥0</div><div class="sub" id="sAmountSub">当前筛选周期</div>
      </div>
      <div class="card c-primary">
        <div class="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>门店数</div>
        <div class="val" id="sAgents">0</div><div class="sub">名下门店代理</div>
      </div>
      <div class="card">
        <div class="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>业绩记录</div>
        <div class="val" id="sRows">0</div><div class="sub">条明细</div>
      </div>
    </div>

    <div class="panel" id="panelTop">
      <div class="panel-h"><h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>门店业绩 TOP 10</h2></div>
      <div class="panel-b"><div class="bars" id="bars"></div></div>
    </div>

    <div class="panel">
      <div class="panel-h">
        <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>业绩明细</h2>
        <div class="spacer"></div>
        <div class="ctrl">
          <select id="fPeriod" onchange="reload()"><option value="">全部周期</option></select>
          <input type="search" id="fKw" placeholder="搜索门店姓名/ID" oninput="debounceReload()">
          <button class="mini" onclick="exportMine()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>导出我的数据
          </button>
        </div>
      </div>
      <div class="table-wrap" style="overflow-x:auto">
        <table>
          <thead><tr>
            <th class="sortable" onclick="setSort('user_id')">用户ID</th>
            <th>昵称</th><th>姓名</th><th>代理等级</th>
            <th class="sortable" onclick="setSort('period')">业绩周期</th>
            <th class="num sortable" onclick="setSort('amount')">金额 ▾</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="cards-m" id="mlist"></div>
      <div class="pager" id="pager"></div>
    </div>
  </main>
</div>

<!-- 修改密码弹窗 -->
<div id="pwdModal" class="modal hide">
  <div class="modal-in">
    <h3>修改密码</h3>
    <div id="pwdMsg"></div>
    <div class="field"><label>原密码</label><input type="password" id="oldPwd"></div>
    <div class="field"><label>新密码</label><input type="password" id="newPwd" placeholder="6-32 位"></div>
    <div class="field"><label>确认新密码</label><input type="password" id="newPwd2"></div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-sec" onclick="closePwd()">取消</button>
      <button class="btn" onclick="savePwd()">确认修改</button>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const fmt = (n) => '¥' + Number(n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtK = (n) => { n = Number(n || 0); return n >= 10000 ? '¥' + (n / 10000).toFixed(1) + '万' : fmt(n); };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const ICON = {
  err: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
};
function showMsg(el, type, text) {
  $(el).innerHTML = text ? `<div class="msg ${type}">${ICON[type] || ''}<div>${esc(text)}</div></div>` : '';
}

/* 页面版本号：用于确认浏览器加载的不是旧缓存页面 */
const PAGE_VER = 'v1.3';

/* 全局错误可视化：任何 JS 异常都直接显示在页面顶部，不再静默失败 */
function fatal(msg) {
  let bar = document.getElementById('fatalBar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'fatalBar';
    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#dc2626;color:#fff;' +
      'padding:10px 14px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-all;box-shadow:0 2px 8px rgba(0,0,0,.3)';
    document.body.appendChild(bar);
  }
  bar.textContent = '页面异常（请截图反馈）：' + msg;
}
window.addEventListener('error', (e) => fatal((e.message || '未知错误') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')));
window.addEventListener('unhandledrejection', (e) => fatal('未捕获的异步错误：' + ((e.reason && e.reason.message) || e.reason || '')));

async function api(url, opts) {
  // credentials 显式声明 same-origin，确保会话 Cookie 一定随请求发送
  const r = await fetch(url, Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, opts));
  let d = {};
  try { d = await r.json(); } catch (e) { throw new Error('服务器无响应（HTTP ' + r.status + '）'); }
  if (!r.ok || !d.ok) throw new Error(d.error || ('请求失败 ' + r.status));
  return d;
}

/* ---------- 登录 / 注册 ---------- */
function switchTab(t) {
  const isL = t === 'login';
  $('tabLogin').classList.toggle('on', isL);
  $('tabReg').classList.toggle('on', !isL);
  $('formLogin').classList.toggle('hide', !isL);
  $('formReg').classList.toggle('hide', isL);
  showMsg('authMsg', '', '');
}

async function checkPhone() {
  const p = $('regPhone').value.trim();
  if (!/^1[3-9]\d{9}$/.test(p)) return;
  try {
    const d = await api('/api/dealer/check-phone', { method: 'POST', body: JSON.stringify({ phone: p }) });
    if (!d.inTable) { $('phoneHint').innerHTML = '<span style="color:#dc2626">✕ 该手机号不在业绩名单中，无法注册</span>'; }
    else if (d.registered) { $('phoneHint').innerHTML = '<span style="color:#ea580c">该手机号已注册，请切换到「登录」</span>'; }
    else { $('phoneHint').innerHTML = `<span style="color:#16a34a">✓ 已匹配到 ${d.rows} 条业绩记录（${esc(d.name)}），可注册</span>`; }
  } catch (e) { $('phoneHint').textContent = e.message; }
}

async function doRegister(ev) {
  ev.preventDefault();
  const phone = $('regPhone').value.trim(), p1 = $('regPwd').value, p2 = $('regPwd2').value;
  if (!/^1[3-9]\d{9}$/.test(phone)) return showMsg('authMsg', 'err', '请输入正确的 11 位手机号');
  if (p1.length < 6) return showMsg('authMsg', 'err', '密码至少 6 位');
  if (p1 !== p2) return showMsg('authMsg', 'err', '两次输入的密码不一致');
  $('btnReg').disabled = true;
  try {
    await api('/api/dealer/register', { method: 'POST', body: JSON.stringify({ phone, password: p1 }) });
    showMsg('authMsg', 'ok', '注册成功，正在进入…');
    await enterApp();
  } catch (e) {
    showMsg('authMsg', 'err', e.message);
    // 409 已注册：自动跳回登录 tab 并把手机号填过去，省得用户再敲一遍
    if (/已注册/.test(e.message)) {
      $('loginPhone').value = phone;
      switchTab('login');
    }
  }
  $('btnReg').disabled = false;
}

async function doLogin(ev) {
  ev.preventDefault();
  const phone = $('loginPhone').value.trim(), pwd = $('loginPwd').value;
  if (!/^1[3-9]\d{9}$/.test(phone)) return showMsg('authMsg', 'err', '请输入正确的 11 位手机号');
  $('btnLogin').disabled = true;
  try {
    await api('/api/dealer/login', { method: 'POST', body: JSON.stringify({ phone, password: pwd }) });
    await enterApp();
  } catch (e) { showMsg('authMsg', 'err', e.message); }
  $('btnLogin').disabled = false;
}

async function doLogout() {
  await api('/api/dealer/logout', { method: 'POST' }).catch(() => {});
  location.reload();
}

/* ---------- 主界面 ---------- */
let state = { page: 1, size: 20, sort: 'amount', dir: 'desc' };

async function enterApp() {
  let me;
  try { me = await api('/api/dealer/me'); }
  catch (e) {
    // 不再静默弹回：把真实原因显示出来，便于定位（如 Cookie 未带上 / 会话过期）
    $('auth').classList.remove('hide'); $('app').classList.add('hide');
    showMsg('authMsg', 'err', '登录态校验失败：' + e.message);
    return;
  }
  $('auth').classList.add('hide');
  $('app').classList.remove('hide');
  $('myName').textContent = me.name || '经销商';
  $('myPhone').textContent = me.phone;
  // 渲染周期下拉必须容错：me.periods 不存在或非数组时显示空列表，
  // 不能让它抛错冒泡到外层触发 boot catch 的 UI 回滚
  const sel = $('fPeriod');
  const periods = Array.isArray(me.periods) ? me.periods : [];
  sel.innerHTML = '<option value="">全部周期</option>' + periods.map((p) => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
  try { await reload(); }
  catch (e) { showMsg('authMsg', 'err', '数据加载失败：' + e.message); }
}

let tmr = null;
function debounceReload() { clearTimeout(tmr); tmr = setTimeout(() => { state.page = 1; reload(); }, 350); }
function setSort(f) {
  if (state.sort === f) state.dir = state.dir === 'desc' ? 'asc' : 'desc';
  else { state.sort = f; state.dir = 'desc'; }
  state.page = 1; reload();
}

async function reload() {
  const period = $('fPeriod').value, kw = $('fKw').value.trim();
  try {
    const s = await api(`/api/dealer/summary?period=${encodeURIComponent(period)}`);
    $('sAmount').textContent = fmtK(s.total.amount);
    $('sAgents').textContent = s.total.agents;
    $('sRows').textContent = s.total.rows;
    $('sAmountSub').textContent = period ? period + ' 周期' : '全部周期累计';
    renderBars(s.top);

    const q = new URLSearchParams({ period, kw, page: state.page, size: state.size, sort: state.sort, dir: state.dir });
    const d = await api('/api/dealer/records?' + q);
    renderRows(d);
  } catch (e) {
    if (/未登录|过期/.test(e.message)) {
      // 不要用 location.reload()：那会触发整页刷新 + boot 重跑，
      // 中间几百毫秒会让用户看到一闪而过的"登录页"，误以为是"弹回登录页"。
      // 直接切回登录页，状态干净。
      $('app').classList.add('hide');
      $('auth').classList.remove('hide');
      showMsg('authMsg', 'err', '登录已过期，请重新登录');
      return;
    }
    alert(e.message);
  }
}

function renderBars(top) {
  if (!top || !top.length) { $('panelTop').classList.add('hide'); return; }
  $('panelTop').classList.remove('hide');
  const max = Math.max(...top.map((t) => t.amount)) || 1;
  $('bars').innerHTML = top.map((t) => `
    <div class="bar-row">
      <div class="bar-name" title="${esc(t.name || t.nickname)}">${esc(t.name || t.nickname || t.user_id)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(t.amount / max * 100).toFixed(1)}%"></div></div>
      <div class="bar-val">${fmtK(t.amount)}</div>
    </div>`).join('');
}

function renderRows(d) {
  const rows = d.rows;
  if (!rows.length) {
    const e = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 21l-4.35-4.35"/><circle cx="11" cy="11" r="8"/></svg><div>没有查询到业绩记录</div></div>`;
    $('tbody').innerHTML = `<tr><td colspan="6">${e}</td></tr>`;
    $('mlist').innerHTML = e; $('pager').innerHTML = ''; return;
  }
  $('tbody').innerHTML = rows.map((r) => `<tr>
    <td>${esc(r.user_id)}</td><td>${esc(r.nickname)}</td><td>${esc(r.name)}</td>
    <td><span class="tag">${esc(r.agent_level)}</span></td><td>${esc(r.period)}</td>
    <td class="num money">${fmt(r.amount)}</td></tr>`).join('');

  $('mlist').innerHTML = rows.map((r) => `<div class="m-item">
    <div class="m-top"><div><div class="m-name">${esc(r.name || r.nickname)}</div>
      <div class="m-id">ID ${esc(r.user_id)} · ${esc(r.nickname)}</div></div>
      <span class="tag">${esc(r.agent_level)}</span></div>
    <div class="m-grid">
      <div><span>业绩金额</span><b class="money">${fmt(r.amount)}</b></div>
      <div><span>业绩周期</span><b>${esc(r.period)}</b></div>
    </div></div>`).join('');

  $('pager').innerHTML = `
    <button onclick="goPage(1)" ${d.page <= 1 ? 'disabled' : ''}>首页</button>
    <button onclick="goPage(${d.page - 1})" ${d.page <= 1 ? 'disabled' : ''}>上一页</button>
    <span class="info">第 ${d.page} / ${d.pages} 页 · 共 ${d.total} 条</span>
    <button onclick="goPage(${d.page + 1})" ${d.page >= d.pages ? 'disabled' : ''}>下一页</button>
    <button onclick="goPage(${d.pages})" ${d.page >= d.pages ? 'disabled' : ''}>末页</button>`;
}
function goPage(p) { state.page = p; reload(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function exportMine() {
  location.href = '/api/dealer/export.csv?period=' + encodeURIComponent($('fPeriod').value);
}

/* ---------- 修改密码 ---------- */
function openPwd() { $('pwdModal').classList.remove('hide'); showMsg('pwdMsg', '', ''); }
function closePwd() { $('pwdModal').classList.add('hide'); $('oldPwd').value = $('newPwd').value = $('newPwd2').value = ''; }
async function savePwd() {
  const o = $('oldPwd').value, n = $('newPwd').value, n2 = $('newPwd2').value;
  if (n.length < 6) return showMsg('pwdMsg', 'err', '新密码至少 6 位');
  if (n !== n2) return showMsg('pwdMsg', 'err', '两次输入的新密码不一致');
  try {
    await api('/api/dealer/change-password', { method: 'POST', body: JSON.stringify({ oldPassword: o, newPassword: n }) });
    alert('密码修改成功，请重新登录');
    location.reload();
  } catch (e) { showMsg('pwdMsg', 'err', e.message); }
}

/* 启动：绑定兜底事件 + 版本水印 + 已有会话直接进主界面 */
(async function boot() {
  // Tab 再用 addEventListener 绑一次；switchTab 幂等，内联 onclick 若失效仍可切换
  $('tabLogin').addEventListener('click', () => switchTab('login'));
  $('tabReg').addEventListener('click', () => switchTab('reg'));

  // 右下角版本水印：确认浏览器加载的是最新页面而非缓存旧版
  const vm = document.createElement('div');
  vm.textContent = PAGE_VER;
  vm.style.cssText = 'position:fixed;right:8px;bottom:6px;font-size:11px;color:rgba(148,163,184,.75);z-index:200;pointer-events:none';
  document.body.appendChild(vm);

  try { await api('/api/dealer/me'); await enterApp(); }
  catch (e) {
    // 进入主界面过程中任何异常：必须把 app 也隐藏 + auth 显示，
    // 避免 enterApp 已 hide(auth)/show(app) 后抛错留下两层重叠 UI
    $('app').classList.add('hide');
    $('auth').classList.remove('hide');
  }
})();
</script>
